# Proyecto del kiosco para iPad (#40). Se genera con XcodeGen:
#
#   brew install xcodegen
#   cd apps/ios && xcodegen
#
# El .xcodeproj NO se versiona: sale de aquí, y así un cambio de proyecto se
# revisa en estas líneas y no en un pbxproj de miles.
name: AstaKiosco
options:
  bundleIdPrefix: com.supricom.asta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Kiosco.xcconfig
  Release: Config/Kiosco.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AstaKiosco:
    type: application
    platform: iOS
    sources:
      - path: AstaKiosco
    settings:
      base:
        # El de las tiendas: no se puede cambiar una vez publicada.
        PRODUCT_BUNDLE_IDENTIFIER: com.supricom.asta
        # Solo iPad: es una tablet en un soporte.
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AstaKiosco/Info.plist
        # El logotipo «asta» sobre blanco (Recursos/Assets.xcassets/AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AstaKiosco/Info.plist
      properties:
        CFBundleDisplayName: ASTA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        # Horizontal y a pantalla completa. Sin `UIRequiresFullScreen`, el iPad
        # no respeta la orientación: la app podría abrirse en Split View.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - Sora_400Regular.ttf
          - Sora_500Medium.ttf
          - Sora_600SemiBold.ttf
          - Sora_700Bold.ttf
          - DMMono_400Regular.ttf
          - DMMono_500Medium.ttf
        # Del xcconfig: ver Config/Kiosco.example.xcconfig. Sin AstaApiKey (la
        # versión de la tienda de apps), la tablet pide al abrirse el código
        # de 6 dígitos que da el panel.
        AstaApiBase: $(ASTA_API_BASE)
        AstaApiKey: $(ASTA_API_KEY)
        # La cámara solo se usa para leer el QR del código que da el panel.
        NSCameraUsageDescription: La cámara se usa solo para leer el código QR que vincula esta tablet.
        # Solo HTTPS del sistema: exenta de la declaración de exportación, y así
        # App Store Connect no la pregunta en cada subida.
        ITSAppUsesNonExemptEncryption: false
        # El middleware de desarrollo es http://localhost; producción va por https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  AstaKioscoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AstaKioscoTests
    dependencies:
      - target: AstaKiosco
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  # Las capturas de la App Store: ver AstaKioscoUITests/CapturasTests.swift.
  AstaKioscoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AstaKioscoUITests
    dependencies:
      - target: AstaKiosco
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: AstaKiosco
schemes:
  Capturas:
    build:
      targets:
        AstaKiosco: all
        AstaKioscoUITests: [test]
    test:
      targets:
        - AstaKioscoUITests
  AstaKiosco:
    build:
      targets:
        AstaKiosco: all
        AstaKioscoTests: [test]
    test:
      targets:
        - AstaKioscoTests
